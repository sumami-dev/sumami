[package]
name = "sumimi"
description = "Sumimi — the self-hosted analytics service, as a library: the server, the client and both data engines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# **A crates.io name is permanent**: a version can be yanked, but a crate cannot
# be renamed. The project was called `sumami` until v0.2.0 — the old crate
# (sumami v0.1.0) stays where it is; this is the one to use.

[lib]
name = "sumimi"
path = "src/lib.rs"

# The one and only executable: the server and the client in a single binary,
# sharing one copy of DuckDB and one implementation of every report.
[[bin]]
name = "sumimi"
path = "src/bin/sumimi.rs"

[features]
default = ["tls", "duckdb-static"]
# Static DuckDB: the executable is self-contained (one file to deploy).
# Build with --no-default-features to link libduckdb dynamically instead.
#
# The features of the two crates below are off by default and forwarded by
# name: `--no-default-features` has to really be smaller, and it has to really
# be able to leave the ACME stack out.
tls = ["sumimi-service/tls"]
duckdb-static = ["sumimi-service/duckdb-static", "sumimi-cli/duckdb-static"]
# The dynamic build: the prebuilt library is downloaded, not compiled.
duckdb-dynamic = ["sumimi-service/duckdb-dynamic", "sumimi-cli/duckdb-dynamic"]

[dependencies]
anyhow.workspace = true
tokio.workspace = true

# The two halves of the open-source build.
#
# The versions are needed for publishing: the paths are used locally, and the
# versions are what the published crate depends on.
sumimi-service = { path = "../service", version = "0.3.0", default-features = false }
sumimi-cli = { path = "../cli", version = "0.3.0", default-features = false }

[dev-dependencies]
# The tests run the real executable: one sends it a real SIGTERM, the other
# reads the instance it was pointed at.
chrono.workspace = true
libc = "0.2"
serde_json.workspace = true
