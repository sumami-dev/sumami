[package]
name = "sumimi"
description = "Sumimi — the self-hosted analytics service, as a library: the server, the client and both data engines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The project was called `sumami` until v0.2.0. The crates published under
# the old names (sumami, sumami-service, sumami-cli v0.1.0) stay there — **a
# crates.io name is permanent**: a version can be yanked, but a crate cannot be
# renamed. These are the ones to use.

[lib]
name = "sumimi"
path = "src/lib.rs"

# The one and only executable: the server and the client in a single binary,
# sharing one copy of DuckDB and one implementation of every report.
[[bin]]
name = "sumimi"
path = "src/bin/sumimi.rs"

[features]
default = ["duckdb-static"]
# Static DuckDB: the executable is self-contained (one file to deploy).
# Build with --no-default-features to link libduckdb dynamically instead.
duckdb-static = ["sumimi-service/duckdb-static"]

[dependencies]
anyhow.workspace = true
tokio.workspace = true

# The two halves of the open-source build.
#
# The versions are needed for publishing: the paths are used locally, and the
# versions are what the published crate depends on.
sumimi-service = { path = "../service", version = "0.2.0" }
sumimi-cli = { path = "../cli", version = "0.2.0" }

[dev-dependencies]
# The tests run the real executable: one sends it a real SIGTERM, the other
# reads the instance it was pointed at.
chrono.workspace = true
libc = "0.2"
serde_json.workspace = true
