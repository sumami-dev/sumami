# The default build statically links DuckDB (see the `duckdb-static` feature in
# service/Cargo.toml and cli/Cargo.toml), so the release is a single file with no
# shared library to ship and no rpath to set.
#
# If you build with `--no-default-features`, DuckDB is linked dynamically and the
# library is looked up next to the binary; uncomment the rpath settings for your
# platform to make that work out of the box.

# [target.aarch64-apple-darwin]
# rustflags = ["-C", "link-arg=-Wl,-rpath,@loader_path"]

# [target.x86_64-apple-darwin]
# rustflags = ["-C", "link-arg=-Wl,-rpath,@loader_path"]

# [target.x86_64-unknown-linux-gnu]
# rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN"]

# [target.aarch64-unknown-linux-gnu]
# rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN"]
