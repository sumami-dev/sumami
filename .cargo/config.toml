# The build statically links DuckDB (see the `duckdb-static` feature in
# service/Cargo.toml and cli/Cargo.toml), so the release is a single file with
# no shared library to ship and no rpath to set.
#
# There is one build: the static one. A smaller executable was tried — the
# prebuilt DuckDB is 63 MB on its own, so the "small" release was bigger than
# the single file, and two files are worse than one.
