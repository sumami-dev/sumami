[package]
name = "sumimi-cli"
description = "Sumimi CLI — read and analyze a Sumimi DuckDB database offline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The project was called `sumami` until v0.2.0. The crates published under
# the old names (sumami, sumami-service, sumami-cli v0.1.0) stay there — **a
# crates.io name is permanent**: a version can be yanked, but a crate cannot be
# renamed. These are the ones to use.

[lib]
name = "sumimi_cli"
path = "src/lib.rs"

[features]
default = ["duckdb-static"]
# Static DuckDB: the executable is self-contained (one file to deploy).
# Build with --no-default-features to link libduckdb dynamically instead.
duckdb-static = ["duckdb/bundled"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
duckdb.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq = { version = "3", features = ["json"] }
tokio.workspace = true
uuid = { version = "1", features = ["v4"] }
# The shared layer: the schema, the models and every report live here, so the
# server and the client cannot drift apart.
#
# The version is needed for publishing: the path is used locally, and the
# version is what the published crate depends on.
sumimi-service = { path = "../service", version = "0.2.0" }
