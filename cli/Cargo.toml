[package]
name = "sumami-cli"
description = "Sumami CLI — read and analyze a Sumami DuckDB database offline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Published as v0.1.0. **A crates.io name is permanent** — a version can be
# yanked, but a crate cannot be renamed. (The crates were held back while the
# name was being decided; the decision was to publish them as they are.)

[lib]
name = "sumami_cli"
path = "src/lib.rs"

[features]
default = ["duckdb-static"]
# Static DuckDB: the executable is self-contained (one file to deploy).
# Build with --no-default-features to link libduckdb dynamically instead.
duckdb-static = ["duckdb/bundled"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
duckdb.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq = { version = "3", features = ["json"] }
tokio.workspace = true
uuid = { version = "1", features = ["v4"] }
# The shared layer: the schema, the models and every report live here, so the
# server and the client cannot drift apart.
#
# The version is needed for publishing: the path is used locally, and the
# version is what the published crate depends on.
sumami-service = { path = "../service", version = "0.1.0" }
