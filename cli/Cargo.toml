[package]
name = "sumami-cli"
description = "Sumami CLI — read and analyze a Sumami DuckDB database offline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The crates are not published yet, and they will not be until the name is
# settled: a crates.io name is effectively permanent (you can yank a version,
# but you cannot rename the crate). Publishing `sumami-service` before the
# naming question is answered would lock in a name we may have to change.
publish = false

[lib]
name = "sumami_cli"
path = "src/lib.rs"

[features]
default = ["duckdb-static"]
# Static DuckDB: the executable is self-contained (one file to deploy).
# Build with --no-default-features to link libduckdb dynamically instead.
duckdb-static = ["duckdb/bundled"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
duckdb.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq = { version = "3", features = ["json"] }
tokio.workspace = true
uuid = { version = "1", features = ["v4"] }
# The shared layer: the schema, the models and every report live here, so the
# server and the client cannot drift apart.
sumami-service = { path = "../service" }
