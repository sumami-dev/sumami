[package]
name = "sumami-service"
description = "Sumami analytics service — single-binary, DuckDB-backed, Umami-compatible"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Published as v0.1.0. **A crates.io name is permanent** — a version can be
# yanked, but a crate cannot be renamed. (The crates were held back while the
# name was being decided; the decision was to publish them as they are.)

# The server is a library: the one and only executable (`sumami`) lives in the
# `cli` crate and uses it for both the server and the client.
[lib]
name = "sumami_service"
path = "src/lib.rs"

[features]
default = ["tls", "duckdb-static"]
# TLS (ACME certificate management). Disable for a smaller binary when a reverse
# proxy terminates TLS instead.
tls = ["dep:rustls-acme", "dep:axum-server", "dep:tokio-stream"]
# Static DuckDB: the executable is self-contained (one file to deploy).
# Build with --no-default-features to link libduckdb dynamically instead.
duckdb-static = ["duckdb/bundled"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
duckdb.workspace = true

# The alternative data engine. SQLite is bundled (compiled in), so the release is
# still one self-contained file — it grows by about 1.2 MB.
#
# Why a second engine: the data plane (the events) is append-only and read as
# aggregations, which DuckDB does cheaper and faster; but everything else an
# instance keeps — logins, logs, the GSC import, the cache, query snapshots,
# the AI chat history — is small, mutable and transactional, which SQLite does
# better. The two live in separate files for exactly that reason.
#
# The uptime checker needs an HTTP client, and it needs one that does not pull
# a whole async stack into the process: `ureq` is blocking, small, and already
# in the tree (the CLI uses it for the HTTP mode). The checker runs on a
# blocking thread, never on the request path.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# The `functions` feature is the one thing rusqlite keeps behind a flag: it lets
# SQLite call back into Rust. The migration from schema v3 to v4 needs it —
# SQLite has no hash of its own, so the old text ids are turned into UUIDs by a
# function we register (the same SHA-256 the DuckDB migration uses).
rusqlite = { version = "0.37", features = ["bundled", "chrono", "functions"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

argon2 = "0.5"
jsonwebtoken = "9"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

# TLS / ACME. `ring` keeps the build simple (no cmake, no aws-lc-sys).
rustls-acme = { version = "0.15", default-features = false, features = [
    "ring",
    "axum",
    "tokio",
    "tls12",
    "webpki-roots",
], optional = true }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"], optional = true }
tokio-stream = { version = "0.1", features = ["net"], optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
