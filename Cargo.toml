[workspace]
resolver = "2"
members = ["service", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/sumami-dev/sumami"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# DuckDB 2.0.0 (crate version 1.20000.x encodes "20000" -> 2.0.0).
#
# Default: the prebuilt libduckdb is downloaded at build time and linked
# dynamically -> the `sumami` executable stays small (a few MB) and libduckdb.so
# ships next to it. Enable the `bundled` feature (see service/Cargo.toml) to
# statically link DuckDB and get a single self-contained file instead.
# See AGENTS.md §4.1.
duckdb = { version = "1", features = ["chrono"] }
